[package]
name = "pns-core"
version = "0.1.0"
edition = "2024"
# Vendored from pitcher-next-start. Recopy this crate plus
# ../../models/pns-model-v1.json when that repo retrains the artifact.

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
